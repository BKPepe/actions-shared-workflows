name: Build macOS toolchain

# Builds, natively on a macOS runner, the prebuilt parts of the OpenWrt SDK that
# multi-arch-test-build.yml gets from openwrt/gh-action-sdk on Linux, so that
# feeds-package-test-build-macos.yml can restore them instead of building them
# in every pull request: host tools, the package manager host tools, the cross
# toolchain and the kernel tree that kernel modules are built against.
#
# Everything follows the current snapshot on downloads.openwrt.org, which the
# Linux SDK is: its revision, its build configuration and its kernel. The kernel
# is taken from the snapshot SDK itself (configuration, symbol versions,
# modules); only its host programs are rebuilt for macOS. The one deliberate
# difference is the BPF toolchain, which is the runner's Homebrew LLVM instead
# of a llvm-bpf build.
#
# Each part is published as an archive named after the hash of its inputs, so
# only parts whose inputs changed are rebuilt and the others are reused:
#   macos-tools-<arch>-<branch>-<sha>.tar.zst      staging_dir/host
#   macos-toolchain-<arch>-<branch>-<sha>.tar.zst  staging_dir/toolchain-*, staging_dir/target-*
#   macos-hostpkg-<arch>-<branch>-<sha>.tar.zst    apk host tools and their host dependencies
#   macos-kernel-<arch>-<branch>-<sha>.tar.zst     the kernel files the SDK ships
#   macos-sdk-<branch>-<arch>.json                 manifest, written last

on:
  workflow_call:
    inputs:
      branch:
        description: OpenWrt branch whose snapshot to follow (master or openwrt-X.Y)
        type: string
        default: master
      matrix:
        description: JSON string of the build matrix (arch/target pairs)
        type: string
        default: ''
      sdk_url:
        description: Base URL serving the published archives (public read), used to reuse unchanged parts
        type: string
        default: https://s3-ccache.openwrt-ci.ansuel.com
      force:
        description: Rebuild every part, even if an archive for its inputs is already published
        type: boolean
        default: false
    secrets:
      s3_endpoint:
      s3_bucket:
      s3_access_key:
      s3_secret_key:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} SDK parts (${{ inputs.branch }})
    runs-on: macos-26
    timeout-minutes: 240
    concurrency:
      group: macos-toolchain-${{ inputs.branch }}-${{ matrix.arch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: >-
        ${{
          inputs.matrix != '' && fromJSON(inputs.matrix) ||
          fromJSON('{"include": [
            {"arch": "aarch64_generic", "target": "armsr-armv8"},
            {"arch": "arm_cortex-a9_vfpv3-d16", "target": "mvebu-cortexa9"}
          ]}')
        }}

    env:
      BRANCH: ${{ inputs.branch }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      BUILD_DIR: /Volumes/OpenWrt/build
      MANIFEST: macos-sdk-${{ inputs.branch }}-${{ matrix.arch }}.json
      SDK_URL: ${{ inputs.sdk_url }}
      FORCE: ${{ inputs.force }}
      # preinstalled on macos-26
      LLVM_FORMULA: llvm@20

    steps:
      - name: Check S3 credentials
        id: creds
        env:
          S3_ENDPOINT: ${{ secrets.s3_endpoint }}
          S3_BUCKET: ${{ secrets.s3_bucket }}
          S3_ACCESS_KEY: ${{ secrets.s3_access_key }}
          S3_SECRET_KEY: ${{ secrets.s3_secret_key }}
        run: |
          if [ -z "$S3_ENDPOINT" ] || [ -z "$S3_BUCKET" ] || [ -z "$S3_ACCESS_KEY" ] || [ -z "$S3_SECRET_KEY" ]; then
            echo "S3 credentials are not configured: every SDK part will be built, and nothing published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up case-sensitive build volume
        run: |
          hdiutil create -size 40g -type SPARSE -fs "Case-sensitive APFS" -volname OpenWrt "$RUNNER_TEMP/OpenWrt.sparseimage"
          hdiutil attach "$RUNNER_TEMP/OpenWrt.sparseimage"
          mkdir -p "$BUILD_DIR"
          df -h / /Volumes/OpenWrt

      - name: Resolve snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$BRANCH" in
            main|master)
              SNAPSHOT_PATH=snapshots
              ;;
            openwrt-[0-9]*\.[0-9]*)
              SNAPSHOT_PATH="releases/${BRANCH#openwrt-}-SNAPSHOT"
              ;;
            *)
              echo "::error::Unsupported branch '$BRANCH' (expected main, master or openwrt-X.Y)"
              exit 1
              ;;
          esac
          case "$BRANCH" in
            openwrt-1*|openwrt-2[0-4].*)
              PACKAGE_MANAGER=opkg
              ;;
            *)
              PACKAGE_MANAGER=apk
              ;;
          esac

          BOARD="${TARGET%%-*}"
          SUBTARGET="${TARGET#*-}"
          SNAPSHOT_URL="https://downloads.openwrt.org/$SNAPSHOT_PATH/targets/$BOARD/$SUBTARGET"
          mkdir -p "$RUNNER_TEMP/snapshot"
          cd "$RUNNER_TEMP/snapshot"
          for file in sha256sums version.buildinfo config.buildinfo profiles.json; do
            curl -fsSL "$SNAPSHOT_URL/$file" -o "$file"
          done
          # all files must come from the same snapshot upload
          grep -E ' \*?(version\.buildinfo|config\.buildinfo|profiles\.json)$' sha256sums | shasum -a 256 -c -

          SDK_LINE=$(grep -E ' \*?openwrt-sdk-.*\.Linux-x86_64\.tar\.(zst|xz)$' sha256sums)
          SDK_SHA256="${SDK_LINE%% *}"
          SDK_FILE="${SDK_LINE##* }"
          SDK_FILE="${SDK_FILE#\*}"
          REVISION=$(cat version.buildinfo)
          COMMIT=$(gh api "repos/openwrt/openwrt/commits/${REVISION##*-}" --jq .sha)
          SNAPSHOT_VERMAGIC=$(jq -r '.linux_kernel.vermagic // empty' profiles.json)
          {
            echo "BOARD=$BOARD"
            echo "SUBTARGET=$SUBTARGET"
            echo "PACKAGE_MANAGER=$PACKAGE_MANAGER"
            echo "SNAPSHOT_URL=$SNAPSHOT_URL"
            echo "REVISION=$REVISION"
            echo "COMMIT=$COMMIT"
            echo "SNAPSHOT_VERMAGIC=$SNAPSHOT_VERMAGIC"
            echo "SDK_FILE=$SDK_FILE"
            echo "SDK_SHA256=$SDK_SHA256"
          } >> "$GITHUB_ENV"
          echo "Snapshot $REVISION ($COMMIT), SDK $SDK_FILE, kernel vermagic ${SNAPSHOT_VERMAGIC:-unknown}"

      - name: Check out OpenWrt core
        run: |
          git init -q "$BUILD_DIR"
          git -C "$BUILD_DIR" remote add origin https://github.com/openwrt/openwrt.git
          git -C "$BUILD_DIR" fetch -q --depth 1 origin "$COMMIT"
          git -C "$BUILD_DIR" checkout -q FETCH_HEAD
          cd "$BUILD_DIR"

          # Backdate the tree so restored archives stay newer than their sources.
          find . -type f -not -path './.git/*' -exec touch -t 202001010000.00 {} +

          # The configuration the snapshot was built with, except:
          # - CONFIG_BUILDBOT, which in a full buildroot wipes staging_dir and
          #   build_dir when a toolchain archive meets a newer checkout
          #   (toolchain/Makefile .ver_check); the SDK never has that code, and
          #   everything else it implies is set explicitly in config.buildinfo
          # - the BPF toolchain, taken from the runner's LLVM instead of llvm-bpf
          # - CONFIG_SIGN_EACH_PACKAGE, which the SDK's own Config.in enables
          {
            grep -vE '^(# )?CONFIG_(BUILDBOT|SDK_LLVM_BPF|SIGN_EACH_PACKAGE)[= ]' "$RUNNER_TEMP/snapshot/config.buildinfo"
            echo "CONFIG_SIGN_EACH_PACKAGE=y"
            echo "CONFIG_DEVEL=y"
            echo "CONFIG_BPF_TOOLCHAIN_HOST=y"
            echo "CONFIG_BPF_TOOLCHAIN_HOST_PATH=\"$(brew --prefix "$LLVM_FORMULA")\""
          } > "$RUNNER_TEMP/macos.config"

          # Hash the trees each part is built from; every part also depends on
          # the parts it is built on. The toolchain installs the kernel headers,
          # so it depends on the kernel version and the generic kernel patches.
          sha() { shasum -a 256 | cut -d' ' -f1; }
          TOOLS_SHA=$({
            sha < "$RUNNER_TEMP/macos.config"
            git ls-tree -r HEAD tools config Config.in Makefile rules.mk
            git ls-tree -r HEAD include | grep -v 'include/kernel-[0-9]'
          } | sha)
          TOOLCHAIN_SHA=$({
            echo "$TOOLS_SHA"
            git ls-tree -r HEAD toolchain target/linux/generic "target/linux/$BOARD/Makefile" "target/linux/$BOARD/$SUBTARGET/target.mk"
            git ls-tree -r HEAD include | grep 'include/kernel-[0-9]' || true
          } | sha)
          HOSTPKG_SHA=$({
            echo "$TOOLS_SHA"
            git ls-tree -r HEAD package/Makefile package/system/apk package/utils/lua
          } | sha)
          KERNEL_SHA=$({
            echo "$TOOLCHAIN_SHA $SDK_SHA256"
            git ls-tree -r HEAD "target/linux/$BOARD" package/kernel/linux
          } | sha)
          {
            echo "TOOLS_KEY=macos-tools-$ARCH-$BRANCH-$TOOLS_SHA.tar.zst"
            echo "TOOLCHAIN_KEY=macos-toolchain-$ARCH-$BRANCH-$TOOLCHAIN_SHA.tar.zst"
            if [ "$PACKAGE_MANAGER" = apk ]; then
              echo "HOSTPKG_KEY=macos-hostpkg-$ARCH-$BRANCH-$HOSTPKG_SHA.tar.zst"
            else
              # opkg is not a dependency of every package build
              echo "HOSTPKG_KEY="
            fi
            echo "KERNEL_KEY=macos-kernel-$ARCH-$BRANCH-$KERNEL_SHA.tar.zst"
          } >> "$GITHUB_ENV"

      - name: Plan
        id: plan
        env:
          PUBLISH: ${{ steps.creds.outputs.publish }}
        run: |
          SDK_URL="${SDK_URL%/}"
          if [ "$PUBLISH" != true ]; then
            # nothing can be published, so do not rely on what others published
            FORCE=true
          fi
          echo '{}' > "$RUNNER_TEMP/published.json"
          if [ "$FORCE" != true ] && ! curl -fsSL "$SDK_URL/$MANIFEST" -o "$RUNNER_TEMP/published.json" 2>/dev/null; then
            echo '{}' > "$RUNNER_TEMP/published.json"
          fi
          published() { jq -r ".$1 // empty" "$RUNNER_TEMP/published.json"; }
          plan() {
            if [ -z "$1" ]; then
              echo none
            elif [ "$FORCE" != true ] && curl -fsI "$SDK_URL/$1" > /dev/null 2>&1; then
              echo reuse
            else
              echo build
            fi
          }

          TOOLS=$(plan "$TOOLS_KEY")
          TOOLCHAIN=$(plan "$TOOLCHAIN_KEY")
          HOSTPKG=$(plan "$HOSTPKG_KEY")
          # a kernel that failed for these inputs is not retried until they change
          if [ "$FORCE" != true ] && [ "$(published kernel_failed)" = "$KERNEL_KEY" ]; then
            KERNEL=failed
          else
            KERNEL=$(plan "$KERNEL_KEY")
          fi

          if [ "$FORCE" != true ] &&
             [ "$(published revision)" = "$REVISION" ] &&
             [ "$(published tools)" = "$TOOLS_KEY" ] &&
             [ "$(published toolchain)" = "$TOOLCHAIN_KEY" ] &&
             [ "$(published hostpkg)" = "$HOSTPKG_KEY" ] &&
             { [ "$(published kernel)" = "$KERNEL_KEY" ] || [ "$KERNEL" = failed ]; }; then
            echo "The published SDK parts already match snapshot $REVISION; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Tools: $TOOLS, toolchain: $TOOLCHAIN, host packages: $HOSTPKG, kernel: $KERNEL"
          {
            echo "tools=$TOOLS"
            echo "toolchain=$TOOLCHAIN"
            echo "hostpkg=$HOSTPKG"
            echo "kernel=$KERNEL"
          } >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        if: steps.plan.outputs.skip != 'true'
        run: |
          # The runner image ships third-party taps; drop them so formulae
          # resolve from homebrew/core only.
          for tap in $(brew tap | grep -v '^homebrew/'); do
            brew untap --force "$tap" || echo "::warning::failed to untap $tap"
          done
          brew install \
            automake \
            bash \
            coreutils \
            diffutils \
            findutils \
            gawk \
            git-extras \
            gnu-getopt \
            gnu-sed \
            gpatch \
            grep \
            make \
            minio-mc \
            ncurses \
            pkg-config \
            python-setuptools \
            quilt \
            swig \
            wget
          brew --prefix --installed "$LLVM_FORMULA" > /dev/null 2>&1 || brew install "$LLVM_FORMULA"

          # $GITHUB_PATH entries are prepended, so later lines end up earlier
          # in PATH: GNU tools must come after the system directories here.
          BREW_PREFIX="$(brew --prefix)"
          for dir in \
            "$BREW_PREFIX/bin" \
            "$BREW_PREFIX/opt/coreutils/bin" \
            "$BREW_PREFIX/opt/findutils/libexec/gnubin" \
            "$BREW_PREFIX/opt/gnu-getopt/bin" \
            "$BREW_PREFIX/opt/gnu-sed/bin" \
            "$BREW_PREFIX/opt/make/libexec/gnubin" \
            "$BREW_PREFIX/opt/ncurses/bin" \
            "$BREW_PREFIX/opt/gawk/libexec/gnubin"; do
            echo "$dir" >> "$GITHUB_PATH"
          done
          echo "PKG_CONFIG_PATH=$BREW_PREFIX/opt/ncurses/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Restore reused parts
        if: steps.plan.outputs.skip != 'true'
        shell: bash
        env:
          TOOLS: ${{ steps.plan.outputs.tools }}
          TOOLCHAIN: ${{ steps.plan.outputs.toolchain }}
          HOSTPKG: ${{ steps.plan.outputs.hostpkg }}
          KERNEL: ${{ steps.plan.outputs.kernel }}
        run: |
          SDK_URL="${SDK_URL%/}"
          restore() {
            echo "Restoring $1"
            curl -fsSL "$SDK_URL/$1" | zstd -dc -T0 | tar -C "$BUILD_DIR" -xf -
          }
          # only what a part built below is built on top of
          if [ "$TOOLS" = reuse ] && { [ "$TOOLCHAIN" = build ] || [ "$HOSTPKG" = build ] || [ "$KERNEL" = build ]; }; then
            restore "$TOOLS_KEY"
          fi
          if [ "$TOOLCHAIN" = reuse ] && [ "$KERNEL" = build ]; then
            restore "$TOOLCHAIN_KEY"
          fi

      - name: Configure target
        if: steps.plan.outputs.skip != 'true'
        working-directory: ${{ env.BUILD_DIR }}
        env:
          TOOLS: ${{ steps.plan.outputs.tools }}
        run: |
          # The pull request job adds the SDK's default of enabling every
          # package; use the same configuration so the build stamps match there.
          cp "$RUNNER_TEMP/macos.config" .config
          echo "CONFIG_ALL=y" >> .config
          make defconfig

          fail() { echo "::error::$1"; exit 1; }
          grep -qx 'CONFIG_BUILDBOT=y' .config && fail "CONFIG_BUILDBOT must not be set"
          grep -qx 'CONFIG_USE_LLVM_BUILD=y' .config && fail "llvm-bpf would be built as a host tool"
          grep -qx 'CONFIG_USE_LLVM_HOST=y' .config || fail "BPF packages would not use the runner's LLVM"
          grep -qx 'CONFIG_SDK=y' .config || fail "CONFIG_SDK is required for the SDK's host tools"
          grep -qx 'CONFIG_AUTOREMOVE=y' .config || fail "CONFIG_AUTOREMOVE is required for the host package stamps"

          # The host tools stamp name encodes which tools this configuration builds.
          printf 'print-tools-stamp:\n\t@echo $(tools/stamp-compile)\n' > "$RUNNER_TEMP/tools-stamp.mk"
          TOOLS_STAMP=$(OPENWRT_BUILD=1 make -s -f Makefile -f "$RUNNER_TEMP/tools-stamp.mk" print-tools-stamp)
          TOOLS_STAMP="${TOOLS_STAMP#"$BUILD_DIR"/}"
          echo "TOOLS_STAMP=$TOOLS_STAMP" >> "$GITHUB_ENV"
          if [ "$TOOLS" = reuse ] && [ -d staging_dir/host ] && [ ! -e "$TOOLS_STAMP" ]; then
            fail "The published host tools have no $TOOLS_STAMP; run with force to rebuild them"
          fi
          mkdir -p "$RUNNER_TEMP/out"

      - name: Build host tools
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.tools == 'build'
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          make tools/install -j"$(sysctl -n hw.logicalcpu)" BUILD_LOG=1 || ret=$? .github/workflows/scripts/show_build_failures.sh
          # tools/install does not write the stamp that 'make prepare' leaves and
          # the pull request job checks; its own rule only confirms the build.
          make "$BUILD_DIR/$TOOLS_STAMP"
          if [ ! -e "$TOOLS_STAMP" ]; then
            echo "::error::make did not create $TOOLS_STAMP"
            exit 1
          fi
          tar -cf - staging_dir/host | zstd -T0 -3 -q -o "$RUNNER_TEMP/out/$TOOLS_KEY"

      - name: Build toolchain
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.toolchain == 'build'
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          make toolchain/install -j"$(sysctl -n hw.logicalcpu)" BUILD_LOG=1 || ret=$? .github/workflows/scripts/show_build_failures.sh
          tar -cf - staging_dir/toolchain-* staging_dir/target-* | zstd -T0 -3 -q -o "$RUNNER_TEMP/out/$TOOLCHAIN_KEY"

      - name: Build apk host tools
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.hostpkg == 'build'
        working-directory: ${{ env.BUILD_DIR }}
        shell: bash
        run: |
          # Every package build in the full buildroot depends on these; the SDK
          # ships them prebuilt.
          touch "$RUNNER_TEMP/hostpkg.start"
          make package/system/apk/host/compile -j"$(sysctl -n hw.logicalcpu)" BUILD_LOG=1 || ret=$? .github/workflows/scripts/show_build_failures.sh

          # apk installs into staging_dir/host and its host dependencies into
          # staging_dir/hostpkg. With CONFIG_AUTOREMOVE only the empty build
          # stamps stay in build_dir/hostpkg, and those are what keep the pull
          # request job from building them again.
          {
            find staging_dir/host -newer "$RUNNER_TEMP/hostpkg.start" \( -type f -o -type l \)
            find staging_dir/hostpkg build_dir/hostpkg \( -type f -o -type l \)
          } | tar -cf - -T - | zstd -T0 -3 -q -o "$RUNNER_TEMP/out/$HOSTPKG_KEY"

      - name: Assemble kernel from the snapshot SDK
        id: kernel
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.kernel == 'build'
        continue-on-error: true
        timeout-minutes: 60
        working-directory: ${{ env.BUILD_DIR }}
        shell: bash
        run: |
          kval() { make -s -C "target/linux/$BOARD" TOPDIR="$BUILD_DIR" "val.$1"; }
          LINUX_DIR=$(kval LINUX_DIR)
          LINUX_DIR="${LINUX_DIR#"$BUILD_DIR"/}"

          # the kernel source with the OpenWrt patches applied
          make target/linux/prepare -j"$(sysctl -n hw.logicalcpu)" BUILD_LOG=1 || ret=$? .github/workflows/scripts/show_build_failures.sh

          # The kernel of the Linux SDK: kernel modules are built against its
          # configuration, symbol versions and modules on Linux.
          curl -fsSL "$SNAPSHOT_URL/$SDK_FILE" -o "$RUNNER_TEMP/$SDK_FILE"
          echo "$SDK_SHA256  $RUNNER_TEMP/$SDK_FILE" | shasum -a 256 -c -
          case "$SDK_FILE" in
            *.zst) DECOMPRESS="zstd -dc -T0" ;;
            *) DECOMPRESS="xz -dc" ;;
          esac
          SDK_ROOT="${SDK_FILE%.tar.*}"
          mkdir -p "$RUNNER_TEMP/sdk"
          $DECOMPRESS "$RUNNER_TEMP/$SDK_FILE" | tar -C "$RUNNER_TEMP/sdk" -xf - "$SDK_ROOT/$LINUX_DIR" "$SDK_ROOT/include/kernel.mk"
          rm -f "$RUNNER_TEMP/$SDK_FILE"
          SDK_LINUX_DIR="$RUNNER_TEMP/sdk/$SDK_ROOT/$LINUX_DIR"
          if [ ! -f "$SDK_LINUX_DIR/.config" ]; then
            echo "::error::The SDK has no kernel in $LINUX_DIR"
            exit 1
          fi

          # the SDK bakes the vermagic into include/kernel.mk
          VERMAGIC=$(grep 'LINUX_VERMAGIC:=' "$RUNNER_TEMP/sdk/$SDK_ROOT/include/kernel.mk" | grep -oE '[0-9a-f]{32}' | head -n1 || true)
          if [ -z "$VERMAGIC" ] || [ "$VERMAGIC" != "$SNAPSHOT_VERMAGIC" ]; then
            echo "::error::SDK kernel vermagic '$VERMAGIC' does not match the snapshot's '$SNAPSHOT_VERMAGIC'"
            exit 1
          fi
          echo "$VERMAGIC" > "$LINUX_DIR/.vermagic"

          # Native kbuild host programs (fixdep, modpost, ...) and generated
          # headers for the SDK's configuration.
          cp "$SDK_LINUX_DIR/.config" "$LINUX_DIR/.config"
          printf 'sdk-kernel-prepare: FORCE\n\t+$(KERNEL_MAKE) olddefconfig\n\t+$(KERNEL_MAKE) modules_prepare\n' > "$RUNNER_TEMP/kernel-prepare.mk"
          env PATH="$BUILD_DIR/staging_dir/host/bin:$PATH" \
            make -C "target/linux/$BOARD" -f Makefile -f "$RUNNER_TEMP/kernel-prepare.mk" TOPDIR="$BUILD_DIR" sdk-kernel-prepare

          # The configuration must not change apart from the host and compiler
          # identification.
          IGNORE='^CONFIG_(CC_VERSION_TEXT|RUSTC_|RUST_IS_AVAILABLE|BINDGEN_VERSION_TEXT|PAHOLE_VERSION)'
          if ! diff <(grep -vE "$IGNORE" "$SDK_LINUX_DIR/include/config/auto.conf" | sort) \
                    <(grep -vE "$IGNORE" "$LINUX_DIR/include/config/auto.conf" | sort); then
            echo "::error::The kernel configuration changed when prepared on macOS (see the diff above)"
            exit 1
          fi

          # the SDK's build results: symbol versions and modules
          (cd "$SDK_LINUX_DIR" && find . \( -name '*.ko' -o -name Module.symvers -o -name modules.builtin \) -print \
            | tar -cf - -T -) | tar -C "$LINUX_DIR" -xf -
          rm -rf "$RUNNER_TEMP/sdk"

          # The files target/sdk/Makefile puts into the SDK, plus .vermagic,
          # which the full buildroot reads from here.
          KARCH_GENERATED=$(ls -d "$LINUX_DIR"/arch/*/include/generated | head -n1)
          KARCH=$(basename "$(dirname "$(dirname "$KARCH_GENERATED")")")
          KARCHES=$KARCH
          if [ "$KARCH" = arm64 ]; then
            KARCHES="arm64 arm"
          fi
          shopt -s nullglob
          FILES=()
          for f in .config .vermagic Makefile scripts tools/objtool include Module.symvers modules.builtin \
                   tools/build tools/leds tools/power/cpupower tools/scripts tools/spi tools/thermal/tmon \
                   tools/usb/usbip; do
            if [ -e "$LINUX_DIR/$f" ]; then
              FILES+=("$LINUX_DIR/$f")
            fi
          done
          for a in $KARCHES; do
            for f in "$LINUX_DIR/arch/$a/"{Makefile*,module.lds,Kbuild.platforms,*/Platform,include,*/include,scripts,kernel/asm-offsets.s,kernel/module.lds}; do
              if [ -e "$f" ]; then
                FILES+=("$f")
              fi
            done
          done
          # written under a temporary name, so a failed step leaves no archive to upload
          {
            printf '%s\n' "${FILES[@]}"
            find "$LINUX_DIR" -name '*.ko'
          } | tar -cf - -T - | zstd -T0 -3 -q -o "$RUNNER_TEMP/out/$KERNEL_KEY.partial"
          mv "$RUNNER_TEMP/out/$KERNEL_KEY.partial" "$RUNNER_TEMP/out/$KERNEL_KEY"

      - name: Upload logs
        if: always() && steps.plan.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macos-toolchain-${{ inputs.branch }}-${{ matrix.arch }}-logs
          path: /Volumes/OpenWrt/build/logs
          if-no-files-found: ignore

      - name: Publish SDK parts to S3
        if: >-
          steps.plan.outputs.skip != 'true' && steps.creds.outputs.publish == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        shell: bash
        env:
          S3_ENDPOINT: ${{ secrets.s3_endpoint }}
          S3_BUCKET: ${{ secrets.s3_bucket }}
          S3_ACCESS_KEY: ${{ secrets.s3_access_key }}
          S3_SECRET_KEY: ${{ secrets.s3_secret_key }}
          KERNEL_PLAN: ${{ steps.plan.outputs.kernel }}
          KERNEL_OUTCOME: ${{ steps.kernel.outcome }}
        run: |
          MC_DIR="$RUNNER_TEMP/mc-publish"
          trap 'rm -rf "$MC_DIR"' EXIT
          mcc() { mc --config-dir "$MC_DIR" "$@"; }
          # mc wants the bare endpoint, without a bucket or path component
          S3_ENDPOINT=$(echo "$S3_ENDPOINT" | sed -E 's|^([^/]+//[^/]+).*|\1|')
          mcc alias set s3 "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY" > /dev/null

          shopt -s nullglob
          for archive in "$RUNNER_TEMP"/out/*.tar.zst; do
            echo "Uploading $(basename "$archive")"
            mcc cp --quiet "$archive" "s3/$S3_BUCKET/$(basename "$archive")"
          done

          KERNEL="$KERNEL_KEY"
          KERNEL_FAILED=""
          if [ "$KERNEL_PLAN" = failed ] || { [ "$KERNEL_PLAN" = build ] && [ "$KERNEL_OUTCOME" != success ]; }; then
            echo "::warning::No kernel for snapshot $REVISION; packages that need it are skipped"
            KERNEL=""
            KERNEL_FAILED="$KERNEL_KEY"
          fi

          # The manifest goes last so consumers never see it before the archives it points to.
          jq -n \
            --arg revision "$REVISION" \
            --arg openwrt_commit "$COMMIT" \
            --arg snapshot "$SNAPSHOT_URL" \
            --arg sdk_file "$SDK_FILE" \
            --arg sdk_sha256 "$SDK_SHA256" \
            --arg target "$TARGET" \
            --arg image_version "${ImageVersion:-unknown}" \
            --arg llvm_formula "$LLVM_FORMULA" \
            --arg tools "$TOOLS_KEY" \
            --arg tools_stamp "$TOOLS_STAMP" \
            --arg toolchain "$TOOLCHAIN_KEY" \
            --arg hostpkg "$HOSTPKG_KEY" \
            --arg kernel "$KERNEL" \
            --arg kernel_failed "$KERNEL_FAILED" \
            --arg vermagic "$([ -n "$KERNEL" ] && echo "$SNAPSHOT_VERMAGIC")" \
            --arg snapshot_vermagic "$SNAPSHOT_VERMAGIC" \
            --arg config "$(cat "$RUNNER_TEMP/macos.config")" \
            '{schema: 2} + $ARGS.named' > "$RUNNER_TEMP/$MANIFEST"
          mcc pipe "s3/$S3_BUCKET/$MANIFEST" < "$RUNNER_TEMP/$MANIFEST"

          {
            echo "### macOS SDK parts published: $BRANCH / $ARCH"
            echo '```json'
            jq 'del(.config)' "$RUNNER_TEMP/$MANIFEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
